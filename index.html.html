
<div id="finance-form">
<style>
#finance-form {
 --blue:#1761b5;
 font-family:Arial,sans-serif;
 max-width:440px;margin:20px auto;
 padding:20px;background:#f0f5fc;
 border-radius:16px;color:#173b70;
}
#finance-form .panel {
 background:white;padding:23px;border-radius:14px;
}
#finance-form h2 {margin:0 0 7px;font-size:23px}
#finance-form .sub {color:#718096;font-size:13px}
#finance-form label {
 display:block;font-size:13px;font-weight:600;
 margin:17px 0 7px;color:#334155;
}
#finance-form input,#finance-form select {
 width:100%;padding:13px;
 border:1px solid #d9e4f2;border-radius:7px;
 background:white;box-sizing:border-box;
 font-size:14px;outline:none;
}
#finance-form input:focus,#finance-form select:focus {
 border-color:var(--blue);
}
#finance-form button {
 width:100%;padding:14px;margin-top:22px;
 border:0;border-radius:7px;
 background:var(--blue);color:white;
 font-size:15px;font-weight:bold;cursor:pointer;
}
#finance-form .notice {
 background:#eff6ff;padding:12px;
 border-radius:7px;color:#315783;
 font-size:11px;line-height:1.6;margin-top:18px;
}
#finance-form #result {
 font-size:13px;margin-top:12px;
}
</style>

<div class="panel">
<h2>Financial Information</h2>
<p class="sub">Complete your personal information below.</p>

<form id="finance-submit">
<label>Full Name</label>
<input name="name" placeholder="Enter full name" required>

<label>Date of Birth</label>
<input name="dob" type="date" required>

<label>Gmail / Email Address</label>
<input name="email" type="email"
placeholder="example@gmail.com" required>

<label>State</label>
<select name="state" required>
<option value="">Select your state</option>
<option>Andhra Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Delhi</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Uttar Pradesh</option>
<option>West Bengal</option>
<option>Other</option>
</select>

<label>Current Outstanding Amount (₹)</label>
<input name="outstanding" type="number"
min="0" step="0.01" placeholder="Enter amount" required>

<div class="notice">
This is an independent information collection form.
Information will only be used for the purpose disclosed
by the website operator.
</div>

<label>
<input type="checkbox" required style="width:auto">
 I consent to the collection of the information above.
</label>

<button type="submit">Submit Information →</button>
<div id="result" role="status"></div>
</form>
</div>

<script>
document.getElementById('finance-submit')
.addEventListener('submit',async function(e){
 e.preventDefault();
 const button=this.querySelector('button');
 const result=document.getElementById('result');

 const data=Object.fromEntries(new FormData(this));
 button.disabled=true;
 button.textContent='Submitting...';

 try {
   // Connect your authorized backend endpoint here.
   const response=await fetch('YOUR_BACKEND_ENDPOINT',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(data)
   });
   if(!response.ok) throw new Error('Submission failed');

   result.textContent='Information submitted successfully!';
   this.reset();
 } catch(error) {
   result.textContent='Submission unavailable. Please try again.';
 } finally {
   button.disabled=false;
   button.textContent='Submit Information →';
 }
});
</script>
</div>
